# Trinity Phase 2 Configuration Template
# Copy this file to config.yaml and customize for your environment

# ============================================================================
# Application Settings
# ============================================================================
application:
  name: "Trinity Phase 2"
  version: "1.0.0"
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  data_dir: "data"
  recordings_dir: "recordings"
  exports_dir: "exports"
  temp_dir: "temp"

# ============================================================================
# Camera Configuration
# ============================================================================
cameras:
  count: 3

  # Individual camera settings
  camera_1:
    name: "Camera 1"
    device_id: 0  # USB device index
    resolution: [1920, 1080]  # [width, height]
    fps: 30
    exposure: -6  # Auto exposure if null
    brightness: 128
    contrast: 128
    saturation: 128
    # Physical position (X, Y, Z in meters)
    position: [0.0, 0.0, 3.0]
    # Orientation (roll, pitch, yaw in degrees)
    orientation: [0.0, -30.0, 0.0]

  camera_2:
    name: "Camera 2"
    device_id: 1
    resolution: [1920, 1080]
    fps: 30
    exposure: -6
    brightness: 128
    contrast: 128
    saturation: 128
    position: [10.0, -5.0, 3.5]
    orientation: [0.0, -25.0, 45.0]

  camera_3:
    name: "Camera 3"
    device_id: 2
    resolution: [1920, 1080]
    fps: 30
    exposure: -6
    brightness: 128
    contrast: 128
    saturation: 128
    position: [10.0, 5.0, 3.5]
    orientation: [0.0, -25.0, -45.0]

  # Synchronization settings
  synchronization:
    enabled: true
    max_time_diff_ms: 10  # Maximum allowed time difference between frames

  # Calibration
  calibration:
    checkerboard_size: [9, 6]  # Internal corners
    square_size_mm: 25.0
    aruco_dict: "DICT_6X6_250"
    marker_size_mm: 100.0

# ============================================================================
# Recording Settings
# ============================================================================
recording:
  codec: "h265"  # h264, h265, mjpeg
  quality: "high"  # low, medium, high, lossless
  bitrate_mbps: 10
  circular_buffer:
    enabled: true
    duration_minutes: 10
  event_triggered:
    enabled: true
    pre_roll_seconds: 5
    post_roll_seconds: 10
  save_raw_frames: false
  frame_format: "jpg"  # jpg, png
  compression_quality: 95

# ============================================================================
# Object Detection Settings
# ============================================================================
detection:
  model: "yolov8x"  # yolov8n, yolov8s, yolov8m, yolov8l, yolov8x, yolov10x
  model_path: "models/weights/yolov8x.pt"
  device: "cuda"  # cuda, cpu, mps

  # Detection parameters
  confidence_threshold: 0.5
  nms_threshold: 0.4
  max_detections: 100

  # Per-class confidence thresholds
  class_thresholds:
    person: 0.6
    bicycle: 0.5
    car: 0.5
    motorcycle: 0.5
    bus: 0.5
    truck: 0.5
    traffic_light: 0.6
    stop_sign: 0.6

  # Classes to detect (COCO format)
  enabled_classes:
    - person
    - bicycle
    - car
    - motorcycle
    - bus
    - truck
    - traffic_light
    - stop_sign
    - dog
    - cat

  # Inference settings
  batch_size: 1
  half_precision: true  # Use FP16 for faster inference
  augment: false  # Test-time augmentation

# ============================================================================
# Object Tracking Settings
# ============================================================================
tracking:
  algorithm: "deepsort"  # deepsort, sort, bytetrack

  # DeepSORT parameters
  deepsort:
    max_age: 30  # Maximum frames to keep track alive without detection
    min_hits: 3  # Minimum detections before track is confirmed
    iou_threshold: 0.3
    max_iou_distance: 0.7

    # Re-identification
    feature_extractor: "osnet_x0_25"
    reid_threshold: 0.2

  # Track management
  track_buffer_size: 30  # Frames to keep in trajectory
  min_track_length: 10  # Minimum frames for valid track

  # Multi-view fusion
  fusion:
    enabled: true
    distance_threshold: 1.0  # meters
    confidence_boost: 0.1  # Increase confidence for multi-view detections

# ============================================================================
# 3D Position Estimation
# ============================================================================
position_3d:
  method: "homography"  # homography, triangulation, depth_estimation
  ground_plane:
    enabled: true
    z_offset: 0.0  # Ground level Z coordinate

  triangulation:
    min_cameras: 2
    max_reprojection_error: 5.0  # pixels

  height_estimation:
    enabled: true
    default_heights:
      person: 1.7
      car: 1.5
      truck: 3.0
      bus: 3.5
      bicycle: 1.2
      motorcycle: 1.3

# ============================================================================
# AV Monitoring Settings (Phase 3)
# ============================================================================
av_monitoring:
  # Enable/disable features
  enable_marker_detection: true
  enable_trajectory_analysis: true
  enable_safety_metrics: true
  enable_event_detection: true

  # AV identification with ArUco markers
  identification:
    method: "aruco_marker"  # aruco_marker, license_plate, manual
    aruco:
      dictionary_type: "DICT_4X4_50"  # DICT_4X4_50, DICT_5X5_50, DICT_6X6_50
      min_marker_perimeter: 100  # pixels
      adaptive_thresh_win_size_min: 3
      adaptive_thresh_win_size_max: 23
      adaptive_thresh_win_size_step: 10
    max_assignment_distance: 100.0  # pixels
    iou_threshold: 0.3

  # Registered AV vehicles
  registered_vehicles:
    - av_id: "AV001"
      marker_ids: [0, 1]  # ArUco marker IDs on this vehicle
      vehicle_type: "car"
      notes: "Primary test vehicle"
    - av_id: "AV002"
      marker_ids: [2, 3]
      vehicle_type: "car"
      notes: "Secondary test vehicle"
    - av_id: "AV003"
      marker_ids: [4, 5]
      vehicle_type: "truck"
      notes: "Heavy vehicle test"

  # Trajectory analysis
  trajectory:
    max_history: 100  # trajectory points
    min_points_for_analysis: 10
    smoothing_window: 5
    smoothing_method: "savgol"  # savgol, spline, moving_average
    prediction_horizon: 3.0  # seconds
    prediction_method: "linear"  # linear, polynomial
    lane_change_threshold: 1.0  # meters
    turn_angle_threshold: 30.0  # degrees

  # Safety metrics
  safety:
    speed_limit: 13.89  # m/s (50 km/h)
    safe_distance_time: 2.0  # seconds
    hard_brake_threshold: -4.0  # m/s²
    rapid_accel_threshold: 3.0  # m/s²
    ttc_warning_threshold: 3.0  # seconds
    ttc_critical_threshold: 1.5  # seconds
    near_miss_distance: 2.0  # meters

  # Event detection
  event_detection:
    auto_clip_extraction: true
    rules:
      near_miss:
        enabled: true
        severity: "high"
        pre_roll: 5.0
        post_roll: 10.0
      high_speed_approach:
        enabled: true
        severity: "critical"
        pre_roll: 5.0
        post_roll: 15.0
      hard_braking:
        enabled: true
        severity: "medium"
        pre_roll: 3.0
        post_roll: 5.0
      lane_change:
        enabled: true
        severity: "info"
        pre_roll: 2.0
        post_roll: 3.0
      sharp_turn:
        enabled: true
        severity: "low"
        pre_roll: 2.0
        post_roll: 3.0
      speed_violation:
        enabled: true
        severity: "low"
        pre_roll: 2.0
        post_roll: 2.0
      pedestrian_interaction:
        enabled: true
        severity: "medium"
        pre_roll: 3.0
        post_roll: 5.0

# ============================================================================
# Scenario Settings
# ============================================================================
scenarios:
  library_path: "trinity/scenarios/library"
  custom_scenarios_path: "config/custom_scenarios"

  # Automatic scenario detection
  auto_detect: true

  # Scenario types
  types:
    - intersection
    - pedestrian_crossing
    - lane_change
    - parking
    - emergency_brake
    - cut_in_cut_out

# ============================================================================
# Edge Case Detection
# ============================================================================
edge_case_detection:
  enabled: true

  # Detection criteria
  criteria:
    ttc_threshold: 2.0
    sudden_appearance_time: 1.0
    trajectory_deviation_sigma: 2.0
    intervention_detected: true
    rule_violation: true

  # Anomaly detection
  anomaly_detection:
    enabled: true
    model: "autoencoder"
    threshold: 0.8

  # Severity scoring
  severity:
    ttc_weight: 0.3
    speed_weight: 0.2
    proximity_weight: 0.2
    complexity_weight: 0.15
    uncertainty_weight: 0.15

  # Automatic clip extraction
  auto_clip:
    enabled: true
    duration_before: 10  # seconds
    duration_after: 5  # seconds

# ============================================================================
# CARLA Integration
# ============================================================================
carla:
  enabled: false
  host: "localhost"
  port: 2000
  timeout: 10.0

  # Scenario export
  scenario_export:
    enabled: true
    output_dir: "exports/carla_scenarios"
    format: "python"  # python, openscenario

  # Synchronization
  synchronous_mode: true
  fixed_delta_seconds: 0.05

  # Map settings
  default_map: "Town03"

  # Weather presets
  weather_presets:
    clear: {cloudiness: 0.0, precipitation: 0.0, sun_altitude_angle: 70.0}
    cloudy: {cloudiness: 80.0, precipitation: 0.0, sun_altitude_angle: 70.0}
    rain: {cloudiness: 100.0, precipitation: 80.0, sun_altitude_angle: 70.0}

# ============================================================================
# Perception Validation
# ============================================================================
perception_validation:
  enabled: false  # Requires AV sensor data

  # Comparison settings
  matching:
    iou_threshold: 0.5
    distance_threshold: 2.0
    velocity_threshold: 2.0

  # Metrics calculation
  metrics:
    - precision
    - recall
    - f1_score
    - ap  # Average Precision
    - mota  # Multiple Object Tracking Accuracy
    - motp  # Multiple Object Tracking Precision

  # Error analysis
  error_analysis:
    position_bins: [0, 10, 25, 50, 100]  # meters
    occlusion_levels: [0, 1, 2, 3]

# ============================================================================
# Dataset Management
# ============================================================================
dataset:
  # Annotation settings
  annotation:
    auto_propagate: true
    validation_required: true
    min_inter_annotator_agreement: 0.8

  # Export formats
  export_formats:
    - coco
    - kitti
    - nuscenes
    - custom_json

  # Data splits
  splits:
    train: 0.7
    val: 0.15
    test: 0.15

  # Anonymization
  anonymization:
    blur_faces: true
    blur_license_plates: true
    blur_radius: 15

# ============================================================================
# Database Configuration
# ============================================================================
database:
  type: "sqlite"  # sqlite, postgresql

  # SQLite settings (development)
  sqlite:
    path: "data/trinity.db"

  # PostgreSQL settings (production)
  postgresql:
    host: "localhost"
    port: 5432
    database: "trinity_av_testing"
    username: "trinity_user"
    password: "change_this_password"
    pool_size: 10
    max_overflow: 20

  # Backup settings
  backup:
    enabled: true
    interval_hours: 6
    retention_days: 30
    backup_dir: "data/backups"

# ============================================================================
# API Settings
# ============================================================================
api:
  enabled: true
  host: "0.0.0.0"
  port: 8000
  reload: false

  # Authentication
  authentication:
    enabled: false
    jwt_secret: "change_this_secret_key"
    token_expiry_hours: 24

  # CORS
  cors:
    enabled: true
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:8080"

  # WebSocket
  websocket:
    enabled: true
    heartbeat_interval: 30
    max_connections: 100

  # Rate limiting
  rate_limiting:
    enabled: true
    requests_per_minute: 60

# ============================================================================
# Analytics & Reporting
# ============================================================================
analytics:
  # Real-time metrics
  realtime:
    update_interval_ms: 100
    history_duration_minutes: 60

  # Report generation
  reports:
    template_dir: "trinity/analytics/templates"
    output_dir: "reports/generated"
    formats:
      - pdf
      - html
      - xlsx

  # Scheduled reports
  scheduled:
    enabled: false
    daily: true
    weekly: true
    monthly: true
    email_recipients: []

# ============================================================================
# GUI Settings
# ============================================================================
gui:
  # Window settings
  window:
    width: 1920
    height: 1080
    fullscreen: false

  # Theme
  theme: "dark"  # dark, light

  # Update rates
  camera_fps: 30
  metrics_update_hz: 10

  # Visualization
  visualization:
    show_bounding_boxes: true
    show_track_ids: true
    show_trajectories: true
    show_predictions: true
    show_safety_zones: true
    trajectory_length: 150  # frames
    prediction_length: 90  # frames (3 seconds at 30 FPS)

  # Colors (RGB)
  colors:
    person: [255, 100, 100]
    car: [100, 255, 100]
    truck: [100, 100, 255]
    bicycle: [255, 255, 100]
    motorcycle: [255, 100, 255]
    bus: [100, 255, 255]
    av_vehicle: [255, 0, 0]
    trajectory: [255, 255, 255]
    prediction: [255, 165, 0]

# ============================================================================
# Performance Settings
# ============================================================================
performance:
  # Threading
  max_workers: 8

  # GPU settings
  gpu:
    device_id: 0
    memory_fraction: 0.9
    allow_growth: true

  # Caching
  cache:
    enabled: true
    max_size_gb: 10

  # Optimization
  optimization:
    use_tensorrt: false
    use_openvino: false
    quantization: false

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  level: "INFO"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"

  # File logging
  file:
    enabled: true
    path: "logs/trinity_{time:YYYY-MM-DD}.log"
    rotation: "1 day"
    retention: "30 days"
    compression: "zip"

  # Console logging
  console:
    enabled: true
    colorize: true

  # Log levels per module
  modules:
    trinity.core: "INFO"
    trinity.detection: "INFO"
    trinity.tracking: "INFO"
    trinity.gui: "WARNING"
    trinity.api: "INFO"

# ============================================================================
# Security Settings
# ============================================================================
security:
  # Data encryption
  encryption:
    enabled: false
    algorithm: "AES256"

  # Access control
  access_control:
    enabled: false
    roles:
      - admin
      - engineer
      - viewer

  # Audit logging
  audit:
    enabled: true
    log_file: "logs/audit.log"

# ============================================================================
# Cloud Integration (Optional)
# ============================================================================
cloud:
  enabled: false

  # AWS S3
  aws:
    enabled: false
    bucket: "trinity-av-testing"
    region: "us-west-2"
    access_key_id: "YOUR_ACCESS_KEY"
    secret_access_key: "YOUR_SECRET_KEY"

  # Google Cloud Storage
  gcs:
    enabled: false
    bucket: "trinity-av-testing"
    credentials_path: "config/gcs-credentials.json"

# ============================================================================
# Experiment Tracking (Optional)
# ============================================================================
experiment_tracking:
  enabled: false
  backend: "mlflow"  # mlflow, wandb

  mlflow:
    tracking_uri: "http://localhost:5000"
    experiment_name: "trinity-av-testing"

  wandb:
    project: "trinity-phase2"
    entity: "your-team"

# ============================================================================
# Report Generation (Phase 5.2)
# ============================================================================
reporting:
  enabled: true

  # Report generator settings
  generator:
    # Basic settings
    title: "Trinity Test Report"
    subtitle: "Autonomous Vehicle Testing & Validation"
    author: "Trinity Platform"
    company: "Autonomous Vehicle Testing Suite"

    # Default format
    default_format: "pdf"  # pdf, html, excel, json
    page_size: "letter"  # letter or A4

    # Content settings
    include_charts: true
    include_images: true
    include_statistics: true
    include_raw_data: false

    # Chart settings
    chart_dpi: 150
    chart_style: "seaborn-v0_8-darkgrid"

    # Output settings
    output_dir: "reports"
    filename_template: "{report_type}_{session_id}_{timestamp}.{ext}"

    # Branding colors
    colors:
      primary: "#2c3e50"
      secondary: "#3498db"
      success: "#27ae60"
      warning: "#f39c12"
      danger: "#e74c3c"

  # Report scheduler settings
  scheduler:
    enabled: true
    check_interval_seconds: 60

    # Scheduled reports
    schedules:
      # Daily HTML summary at 6 PM
      daily_summary:
        enabled: true
        report_type: "session_summary"
        format: "html"
        frequency: "daily"
        hour: 18

      # Weekly PDF full report on Monday at 9 AM
      weekly_full:
        enabled: true
        report_type: "full_report"
        format: "pdf"
        frequency: "weekly"
        day_of_week: 0  # 0=Monday, 6=Sunday
        hour: 9

      # Monthly Excel report on 1st at 8 AM
      monthly_excel:
        enabled: false
        report_type: "full_report"
        format: "excel"
        frequency: "monthly"
        day_of_month: 1
        hour: 8

      # Session-end report (triggered manually)
      session_end:
        enabled: true
        report_type: "session_summary"
        format: "html"
        frequency: "session_end"

  # Report templates
  templates:
    # Use custom templates
    use_custom: false
    template_dir: "config/report_templates"

    # Available templates
    available:
      - "full_report"
      - "safety_report"
      - "edge_case_report"
      - "quick_summary"

  # Report delivery (optional)
  delivery:
    # Email delivery
    email:
      enabled: false
      smtp_host: "smtp.gmail.com"
      smtp_port: 587
      use_tls: true
      username: "your-email@example.com"
      password: "your-app-password"
      from_address: "trinity@example.com"
      to_addresses:
        - "stakeholder1@example.com"
        - "stakeholder2@example.com"
      subject_template: "Trinity Report: {report_type} - {session_name}"

    # Cloud upload
    cloud_upload:
      enabled: false
      provider: "s3"  # s3 or gcs
      bucket: "trinity-reports"
      prefix: "reports/"

  # Report archiving
  archiving:
    enabled: true
    max_age_days: 90  # Delete reports older than 90 days
    compress_old_reports: true
    compression_age_days: 30  # Compress reports older than 30 days
