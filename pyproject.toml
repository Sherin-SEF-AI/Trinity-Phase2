[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trinity-phase2"
version = "1.0.0"
description = "Enterprise-Grade Autonomous Vehicle Testing & Validation Suite with Multi-Camera Infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sherin-SEF-AI", email = "contact@example.com"}
]
maintainers = [
    {name = "Sherin-SEF-AI", email = "contact@example.com"}
]
keywords = [
    "autonomous-vehicles",
    "computer-vision",
    "object-detection",
    "object-tracking",
    "testing",
    "validation",
    "carla",
    "yolo",
    "deep-learning",
    "multi-camera",
    "ground-truth",
    "edge-cases"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.4",
    "scipy>=1.11.4",
    "pandas>=2.1.4",
    "PyQt6>=6.6.1",
    "pyqtgraph>=0.13.3",
    "opencv-python>=4.9.0",
    "ultralytics>=8.1.24",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "filterpy>=1.4.5",
    "scikit-learn>=1.4.0",
    "open3d>=0.18.0",
    "pyvista>=0.43.3",
    "matplotlib>=3.8.2",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
    "loguru>=0.7.2",
    "tqdm>=4.66.1",
    "rich>=13.7.0",
    "pillow>=10.2.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.3.1",
    "pytest-asyncio>=0.23.3",
    "black>=24.1.1",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "isort>=5.13.2",
]
docs = [
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.2",
]
cloud = [
    "boto3>=1.34.34",
    "google-cloud-storage>=2.14.0",
]
gpu = [
    "cupy-cuda12x>=12.3.0",
    "onnxruntime-gpu>=1.16.3",
]
all = [
    "trinity-phase2[dev,docs,cloud,gpu]",
]

[project.urls]
Homepage = "https://github.com/Sherin-SEF-AI/Trinity-Phase2"
Documentation = "https://trinity-phase2.readthedocs.io"
Repository = "https://github.com/Sherin-SEF-AI/Trinity-Phase2.git"
Issues = "https://github.com/Sherin-SEF-AI/Trinity-Phase2/issues"
Changelog = "https://github.com/Sherin-SEF-AI/Trinity-Phase2/blob/main/CHANGELOG.md"

[project.scripts]
trinity = "trinity.main:main"
trinity-api = "trinity.api.server:main"
trinity-calibrate = "trinity.core.calibration:main"

[tool.setuptools]
packages = ["trinity"]

[tool.setuptools.package-data]
trinity = ["py.typed", "gui/styles/*.qss", "scenarios/library/*.yaml"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=trinity",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gui: marks tests that require GUI",
    "gpu: marks tests that require GPU",
    "carla: marks tests that require CARLA simulator",
]

[tool.coverage.run]
source = ["trinity"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
